  <script>
class FormatError extends Error {
  constructor(code) {
    const messages = {
      'is-completion': "Este parece ser o arquivo de conclusão de atividades. Carregue-o no campo 'Conclusão de atividades'.",
      'is-log': "Este parece ser o log. Carregue-o no campo 'Log do curso'.",
      'not-csv': "O arquivo precisa estar em CSV. No Moodle, escolha 'Valores separados por vírgula (.csv)' ao baixar.",
      'not-log': 'Não encontramos as colunas do log do Moodle (Hora, Nome completo, Nome do evento). Confira se baixou Relatórios > Logs.',
      'bad-date': 'Não conseguimos ler as datas deste log. Avise a autora da ferramenta com um exemplo de data (sem nomes).',
    };
    super(messages[code]);
    this.name = 'FormatError';
    this.code = code;
  }
}

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let row = [];
  let field = '';
  let quoted = false;
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (quoted) {
      if (char !== '"') field += char;
      else if (text[i + 1] === '"') {
        field += '"';
        i++;
      } else quoted = false;
    } else if (char === '"' && !field) {
      quoted = true;
    } else if (char === ',') {
      row.push(field);
      field = '';
    } else if (char === '\r' || char === '\n') {
      rows.push([...row, field]);
      row = [];
      field = '';
      if (char === '\r' && text[i + 1] === '\n') i++;
    } else {
      field += char;
    }
  }
  if (quoted) throw new FormatError('not-csv');
  if (row.length || field || text.endsWith('"')) rows.push([...row, field]);
  return rows;
}

const monthNames = 'January February March April May June July August September October November December'.toLowerCase().split(' ');

function parseMoodleDate(input) {
  const value = input.trim();
  const pt = /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4}),\s*(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(value);
  const en = /^(\d{1,2})\s+([a-z]+)\s+(\d{4}),\s*(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)$/i.exec(value);
  if (!pt && !en) return null;
  const [, dayText, monthText, yearText, hourText, minuteText, secondText = '0', meridiem] = pt || en;
  const day = Number(dayText);
  const month = pt ? Number(monthText) - 1 : monthNames.indexOf(monthText.toLowerCase());
  const year = Number(yearText) + (yearText.length === 2 ? 2000 : 0);
  let hour = Number(hourText);
  const minute = Number(minuteText);
  const second = Number(secondText);
  if (en) {
    if (hour < 1 || hour > 12) return null;
    hour = hour % 12 + (meridiem.toUpperCase() === 'PM' ? 12 : 0);
  }
  if (month < 0 || month > 11 || hour > 23 || minute > 59 || second > 59) return null;
  const date = new Date(0);
  date.setFullYear(year, month, day);
  date.setHours(hour, minute, second, 0);
  return date.getFullYear() === year && date.getMonth() === month && date.getDate() === day ? date : null;
}

const logHeaders = {
  pt: ['hora', 'nome completo', 'nome do evento', 'componente', 'origem', 'contexto do evento'],
  en: ['time', 'user full name', 'event name', 'component', 'origin', 'event context'],
};

function reportRows(text) {
  if (!text.trim() || /^(?:\uFEFF)?PK\x03\x04/.test(text) || text.includes('\0')) {
    throw new FormatError('not-csv');
  }
  return parseCSV(text).filter(row => row.some(field => field.trim()));
}

function isCompletionHeader(header) {
  return header[0] === '' && ['endereço de email', 'email address'].includes(header[1]);
}

function parseLog(text) {
  const [first = [], ...rows] = reportRows(text);
  const header = first.map(value => value.trim().toLowerCase());
  if (isCompletionHeader(header)) throw new FormatError('is-completion');
  const language = Object.keys(logHeaders).find(key => logHeaders[key].every(name => header.includes(name)));
  if (!language) throw new FormatError('not-log');
  const [timeIndex, userIndex, eventIndex, componentIndex, originIndex, contextIndex] =
    logHeaders[language].map(name => header.indexOf(name));
  const events = [];
  const contexts = new Map();
  const courseContexts = new Map();
  for (const row of rows) {
    const time = parseMoodleDate(row[timeIndex] ?? '');
    if (!time) continue;
    const context = row[contextIndex]?.trim() ?? '';
    const course = /^(?:Curso|Course):\s*(.+)$/i.exec(context)?.[1].trim();
    if (course) courseContexts.set(course, (courseContexts.get(course) ?? 0) + 1);
    if (context) contexts.set(context, (contexts.get(context) ?? 0) + 1);
    events.push({
      time,
      user: row[userIndex]?.trim() ?? '',
      event: row[eventIndex]?.trim() ?? '',
      component: row[componentIndex]?.trim() ?? '',
      origin: row[originIndex]?.trim().toLowerCase() ?? '',
    });
  }
  if (!events.length) throw new FormatError('bad-date');
  const choices = courseContexts.size ? courseContexts : contexts;
  const course = [...choices].sort((a, b) => b[1] - a[1])[0]?.[0] ?? '';
  return { course, language, events };
}

function parseCompletion(text) {
  const [first = [], ...rows] = reportRows(text);
  const header = first.map(value => value.trim().toLowerCase());
  if (Object.values(logHeaders).some(names => names.slice(0, 3).every(name => header.includes(name)))) {
    throw new FormatError('is-log');
  }
  if (!isCompletionHeader(header) || (header.length - 2) % 2 !== 0) {
    throw new FormatError('not-csv');
  }
  const activities = first.slice(2).filter((_, i) => i % 2 === 0).map(collapseSpaces);
  const students = rows.filter(row => row[0]?.trim()).map(row => ({
    name: row[0].trim(),
    email: row[1]?.trim() ?? '',
    done: activities.map((_, i) => ['Concluído', 'Completed'].includes(row[2 + i * 2]?.trim())),
  }));
  return { activities, students };
}

function collapseSpaces(value) {
  return value.trim().replace(/\s+/g, ' ');
}

function normalizeName(value) {
  return collapseSpaces(value).toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
}

const STAFF_EVENTS = [
  'O envio foi avaliado.', 'Módulo de curso atualizado', 'Módulo do curso criado',
  'Item de nota atualizado', 'Relatório de log visto', 'Formulário de notas visualizado',
  'Seção do curso atualizada', 'Submission graded.', 'Course module updated',
  'Course module created', 'Grade item updated', 'Log report viewed',
];

function isAccess(event) {
  return event.origin === 'web' || event.origin === 'ws';
}

function identifyPeople(events, completion, overrides = {}) {
  const names = new Map();
  const enrolled = new Set();
  const staff = new Set();
  const access = new Set();
  for (const { name } of completion?.students ?? []) {
    const key = normalizeName(name);
    if (!key || names.has(key)) continue;
    names.set(key, name);
    enrolled.add(key);
  }
  for (const event of events) {
    const key = normalizeName(event.user);
    if (!key) continue;
    if (!names.has(key)) names.set(key, event.user);
    if (STAFF_EVENTS.includes(event.event)) staff.add(key);
    if (isAccess(event)) access.add(key);
  }
  const staffOverrides = new Set((overrides.staff ?? []).map(normalizeName));
  const studentOverrides = new Set((overrides.students ?? []).map(normalizeName));
  const result = { students: [], staff: [], source: completion ? 'completion' : 'heuristic' };
  for (const [key, name] of names) {
    if (staffOverrides.has(key)) result.staff.push(name);
    else if (studentOverrides.has(key)) result.students.push(name);
    else if (completion ? enrolled.has(key) : access.has(key) && !staff.has(key)) result.students.push(name);
    else if (completion || staff.has(key)) result.staff.push(name);
  }
  return result;
}

function assignCodes(names) {
  const width = Math.max(2, String(names.length).length);
  return new Map([...names]
    .sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }))
    .map((name, index) => [name, 'E' + String(index + 1).padStart(width, '0')]));
}

const dayMs = 86_400_000;

function dayKey(date) {
  return [String(date.getFullYear()).padStart(4, '0'), date.getMonth() + 1, date.getDate()]
    .map(value => String(value).padStart(2, '0')).join('-');
}

function calendarTime(day) {
  return Date.parse(day + 'T00:00:00Z');
}

function daysBetween(a, b) {
  return (calendarTime(b) - calendarTime(a)) / dayMs;
}

function shiftDay(day, offset) {
  return new Date(calendarTime(day) + offset * dayMs).toISOString().slice(0, 10);
}

function weekStart(day) {
  const weekday = new Date(calendarTime(day)).getUTCDay();
  return shiftDay(day, -((weekday + 6) % 7));
}

function proposePeriod(events, students) {
  const enrolled = new Set(students.map(normalizeName));
  const weeks = new Map();
  let earliest = null;
  for (const event of events) {
    const day = dayKey(event.time);
    if (earliest === null || day < earliest) earliest = day;
    const key = normalizeName(event.user);
    if (!isAccess(event) || !enrolled.has(key)) continue;
    const monday = weekStart(day);
    if (!weeks.has(monday)) weeks.set(monday, new Set());
    weeks.get(monday).add(key);
  }
  const active = [...weeks.keys()].sort();
  const continuous = active.filter(week => weeks.get(week).size >= 0.2 * enrolled.size);
  const selected = continuous.length ? continuous : active;
  const start = selected[0] ?? weekStart(earliest ?? dayKey(new Date()));
  return { start, end: shiftDay(selected.at(-1) ?? start, 6) };
}

function buildClass({ name, log, completion = null, period = null, overrides = {}, absenceLimit = 14 }) {
  const people = identifyPeople(log.events, completion, overrides);
  period ??= proposePeriod(log.events, people.students);
  const { start, end } = period;
  const firstMonday = weekStart(start);
  const weeks = 1 + Math.floor(daysBetween(firstMonday, end) / 7);
  const lastLogDay = log.events.reduce((last, { time }) => {
    const day = dayKey(time);
    return day > last ? day : last;
  }, '');
  const refDate = lastLogDay && lastLogDay < end ? lastLogDay : end;
  const byStudent = new Map(people.students.map(name => [normalizeName(name), []]));
  for (const event of log.events) {
    if (!isAccess(event)) continue;
    const day = dayKey(event.time);
    if (day >= start && day <= refDate) byStudent.get(normalizeName(event.user))?.push(day);
  }
  const completedByName = new Map(completion?.students.map(row => [normalizeName(row.name), row.done]));
  const activities = completion?.activities ?? [];
  const students = [...assignCodes(people.students)].map(([name, code]) => {
    const accesses = byStudent.get(normalizeName(name));
    const activeDays = [...new Set(accesses)].sort();
    const weeklyDays = Array(weeks).fill(0);
    for (const day of activeDays) weeklyDays[Math.floor(daysBetween(firstMonday, day) / 7)]++;
    const half = Math.ceil(weeks / 2);
    const firstHalfWeeks = weeklyDays.slice(0, half).filter(Boolean).length;
    const secondHalfWeeks = weeklyDays.slice(half).filter(Boolean).length;
    const daysSinceLast = activeDays.length ? daysBetween(activeDays.at(-1), refDate) : null;
    const absences = activeDays.length
      ? [daysBetween(start, activeDays[0]), daysSinceLast,
        ...activeDays.slice(1).map((day, i) => daysBetween(activeDays[i], day) - 1)]
      : [Math.max(0, daysBetween(start, refDate) + 1)];
    const done = completedByName.get(normalizeName(name));
    const row = {
      name, code, accesses: accesses.length, daysActive: activeDays.length,
      weeksActive: firstHalfWeeks + secondHalfWeeks, weeklyDays, activeDays, firstHalfWeeks, secondHalfWeeks,
      longestAbsence: absences.reduce((max, days) => Math.max(max, days), 0), daysSinceLast,
      gaps7: absences.filter(days => days >= 7).length,
      gaps14: absences.filter(days => days >= 14).length,
      gaps21: absences.filter(days => days >= 21).length,
      completed: done ? done.filter(Boolean).length : null,
      completionTotal: done ? activities.length : null, done: done ?? null,
    };
    row.pattern = !completion && !row.accesses ? 'irregular' : classifyPattern(row, weeks, absenceLimit);
    return row;
  });
  return {
    name, period, weeks, refDate, students, staff: people.staff, source: people.source,
    hasCompletion: Boolean(completion), activities, absenceLimit,
    warnings: completion ? [] : ['Estudantes que nunca acessaram não aparecem. Carregue a conclusão de atividades para incluí-los.'],
  };
}

const PATTERNS = [
  { id: 'sem-acesso', label: 'Sem acesso', tone: 'red', strategy: 'Contato individual para entender possíveis dificuldades' },
  { id: 'afastamento', label: 'Afastamento', tone: 'red', strategy: 'Contato individual para entender possíveis dificuldades' },
  { id: 'queda', label: 'Queda progressiva', tone: 'amber', strategy: 'Acompanhamento individual e incentivo à retomada' },
  { id: 'concentrado', label: 'Acesso concentrado', tone: 'amber', strategy: 'Orientação sobre rotina de estudos' },
  { id: 'irregular', label: 'Irregular', tone: 'amber', strategy: 'Lembretes e orientações periódicas' },
  { id: 'regular', label: 'Regular', tone: 'green', strategy: '' },
];

function classifyPattern(row, weeks, absenceLimit) {
  if (!row.accesses) return 'sem-acesso';
  if (row.daysSinceLast >= absenceLimit) return 'afastamento';
  if (row.firstHalfWeeks >= 3 && row.secondHalfWeeks <= 0.5 * row.firstHalfWeeks) return 'queda';
  const busiest = [...row.weeklyDays].sort((a, b) => b - a).slice(0, 2).reduce((a, b) => a + b, 0);
  if (row.weeksActive < 0.4 * weeks && busiest > 0.5 * row.daysActive) return 'concentrado';
  if (row.weeksActive < 0.7 * weeks || row.longestAbsence >= absenceLimit) return 'irregular';
  return 'regular';
}

function median(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const middle = Math.floor(sorted.length / 2);
  if (!sorted.length) return 0;
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
}

function mean(values) {
  return values.length ? values.reduce((total, value) => total + value, 0) / values.length : 0;
}

function percent(part, total) {
  return total ? Math.round(1000 * part / total) / 10 : 0;
}

function summarizeClass(c) {
  const n = c.students.length;
  const values = field => c.students.map(row => row[field]);
  const patternCounts = Object.fromEntries(PATTERNS.map(({ id }) => [id, 0]));
  for (const row of c.students) patternCounts[row.pattern]++;
  const patternPct = Object.fromEntries(PATTERNS.map(({ id }) => [id, percent(patternCounts[id], n)]));
  const completion = c.students.filter(row => row.completionTotal).map(row => 100 * row.completed / row.completionTotal);
  return {
    name: c.name, n, staffCount: c.staff.length, start: c.period.start, end: c.period.end, weeks: c.weeks,
    medianWeeksActive: median(values('weeksActive')), meanWeeksActive: mean(values('weeksActive')),
    medianDaysActive: median(values('daysActive')), medianLongestAbsence: median(values('longestAbsence')),
    patternCounts, patternPct,
    studentsWithGap7: values('gaps7').filter(Boolean).length,
    studentsWithGap14: values('gaps14').filter(Boolean).length,
    studentsWithGap21: values('gaps21').filter(Boolean).length,
    medianCompletionPct: completion.length ? Number(median(completion).toFixed(1)) : null,
  };
}

function weeklySeries(c) {
  const counts = Array(c.weeks).fill(0);
  for (const row of c.students) row.weeklyDays.forEach((days, index) => { if (days) counts[index]++; });
  return counts.map((n, index) => ({ week: index + 1, n, pct: percent(n, c.students.length) }));
}

function sustainedDeclineWeek(series) {
  let index = series.length - 1;
  while (index >= 1 && series[index].pct < 50) index--;
  return index < series.length - 1 ? series[index + 1].week : null;
}

function titleWeekly(series) {
  const week = sustainedDeclineWeek(series);
  if (week !== null) return `A partir da semana ${week}, menos da metade da turma acessou o curso`;
  const first = series[0]?.pct ?? 0;
  const last = series.at(-1)?.pct ?? 0;
  if (last <= first - 20) return `O acesso caiu de ${Math.round(first)}% na semana 1 para ${Math.round(last)}% na última semana`;
  return 'A maior parte da turma acessou o curso em todas as semanas';
}

function titleCompare(entries) {
  if (entries.length < 2) return titleWeekly(entries[0]?.series ?? []);
  const finalMean = ({ series }) => mean(series.slice(Math.ceil(series.length / 2)).map(row => row.pct));
  const [leader] = [...entries].sort((a, b) => finalMean(b) - finalMean(a));
  return `${leader.name} manteve mais estudantes acessando até o fim da oferta`;
}

function titlePatterns(summary) {
  const [top] = PATTERNS.filter(({ id }) => id !== 'regular')
    .sort((a, b) => summary.patternCounts[b.id] - summary.patternCounts[a.id]);
  const count = summary.patternCounts[top.id];
  return count ? `${top.label} foi o padrão de atenção mais frequente (${count} de ${summary.n} estudantes)`
    : 'Todos os estudantes tiveram acesso regular';
}


function escapeMarkup(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[char]);
}

const chartInk = '#1f2a24';
const chartMuted = '#536159';
const chartContext = '#9aa0a6';
const chartAxes = '#7b847d';
const chartFocus = print => print ? '#1f5f3b' : '#2e8b57';

function svgText(x, y, value, options = '') {
  return `<text x="${x}" y="${y}" ${options}>${escapeMarkup(value)}</text>`;
}

function chartLines(value, limit) {
  const lines = [''];
  for (const word of value.split(/\s+/)) {
    const last = lines.at(-1);
    if (last && last.length + word.length + 1 > limit) lines.push(word);
    else lines[lines.length - 1] = (last + ' ' + word).trim();
  }
  return lines;
}

function makeChart({ title, subtitle, width, height }, draw) {
  const heading = chartLines(title, Math.floor(width / 12));
  const subheading = chartLines(subtitle, Math.floor(width / 8));
  const top = 28 + heading.length * 25 + subheading.length * 17;
  const headline = heading.map((line, i) => svgText(12, 24 + i * 25, line, 'font-size="20" font-weight="700"')).join('');
  const description = subheading.map((line, i) => svgText(12, 25 + heading.length * 25 + i * 17, line, `fill="${chartMuted}"`)).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${escapeMarkup(title)}" viewBox="0 0 ${width} ${height + top}" font-family="system-ui, sans-serif" font-size="13" fill="${chartInk}"><title>${escapeMarkup(title)}</title><desc>${escapeMarkup(subtitle)}</desc>${headline}${description}<g transform="translate(0 ${top})">${draw()}</g></svg>`;
}

function lineChart({ title, subtitle, series, xLabels, yMax = 100, yUnit = '%', annotation,
  width = 760, height = 236, print = false }) {
  const margin = Math.min(width * 0.4, Math.max(84, ...series.map(item => item.label.length * 7.5 + 24)));
  const left = 48;
  const right = Math.max(left + 1, width - margin);
  const bottom = height - 28;
  const x = index => left + (right - left) * index / Math.max(1, xLabels.length - 1);
  const y = value => bottom - (bottom - 20) * value / (yMax || 1);
  return makeChart({ title, subtitle, width, height }, () => {
    const ticks = xLabels.map((label, i) => {
      const stride = Math.max(1, Math.ceil(xLabels.length / Math.max(2, (right - left) / 42)));
      return i % stride === 0 || i === xLabels.length - 1
        ? svgText(x(i), height - 7, label, `fill="${chartMuted}" text-anchor="middle"`) : '';
    }).join('');
    const axes = `<path d="M${left} 20V${bottom}H${right}" fill="none" stroke="${chartAxes}"/>` +
      svgText(left - 7, 24, yMax + yUnit, `text-anchor="end" fill="${chartMuted}"`) +
      svgText(left - 7, bottom + 4, 0 + yUnit, `text-anchor="end" fill="${chartMuted}"`) + ticks;
    const entries = series.filter(item => item.values.length).map(item => ({ ...item, labelY: y(item.values.at(-1)) }));
    let previous = -3;
    for (const item of [...entries].sort((a, b) => a.labelY - b.labelY)) {
      item.labelY = Math.max(item.labelY, previous + 15);
      previous = item.labelY;
    }
    const overflow = Math.max(0, previous - bottom);
    const lines = entries.map(({ label, values, highlight, labelY }) => {
      const color = highlight ? chartFocus(print) : chartContext;
      const points = values.map((value, index) => x(index) + ',' + y(value)).join(' ');
      const endX = x(values.length - 1);
      const endY = y(values.at(-1));
      const labelX = right + 12;
      labelY -= overflow;
      return `<polyline points="${points}" stroke="${color}" fill="none" stroke-width="${highlight ? 3 : 2}"/><circle cx="${endX}" cy="${endY}" r="3" fill="${color}"/>` +
        (Math.abs(labelY - endY) > 3 || endX < right ? `<path d="M${endX + 4} ${endY} L${labelX - 4} ${labelY}" fill="none" stroke="${color}"/>` : '') +
        svgText(labelX, labelY + 4, label, `fill="${highlight ? '#1f5f3b' : chartMuted}"`);
    }).join('');
    const focused = series.find(item => item.highlight) ?? series[0];
    const value = focused?.values[annotation?.index];
    if (value === undefined) return axes + lines;
    const px = x(annotation.index);
    const py = y(value);
    const rightSide = px < (left + right) / 2;
    return axes + lines + `<circle cx="${px}" cy="${py}" r="5" fill="${chartFocus(print)}"/>` +
      svgText(px + (rightSide ? 8 : -8), py < 42 ? py + 20 : py - 12, annotation.text,
        `fill="#1f5f3b" text-anchor="${rightSide ? 'start' : 'end'}"`);
  });
}

function barChartH({ title, subtitle, bars, unit = '', print = false }) {
  const width = 760;
  const left = 252;
  const ordered = [...bars].sort((a, b) => a.value - b.value);
  const rows = ordered.map(bar => ({ ...bar, lines: chartLines(bar.label, 32) }));
  const height = rows.reduce((total, row) => total + Math.max(31, row.lines.length * 16 + 8), 8);
  const max = Math.max(unit === '%' ? 100 : 1, ...bars.map(bar => bar.value));
  return makeChart({ title, subtitle, width, height }, () => {
    let top = 0;
    return rows.map(({ value, highlight, lines }) => {
      const size = Math.max(31, lines.length * 16 + 8);
      const center = top + size / 2;
      top += size;
      const length = (width - left - 62) * value / max;
      return lines.map((line, i) => svgText(left - 9, center + 4 + (i - (lines.length - 1) / 2) * 16, line, 'text-anchor="end"')).join('') +
        `<rect x="${left}" y="${center - 8}" width="${length}" height="16" fill="${highlight ? chartFocus(print) : chartContext}"/>` +
        svgText(left + length + 7, center + 4, value.toLocaleString('pt-BR') + unit);
    }).join('');
  });
}

function patternBars({ title, subtitle, rows, print = false }) {
  const width = 820;
  const left = 205;
  const span = width - left - 15;
  const colors = print ? ['#222', '#444', '#606060', '#808080', '#aaa', '#e1e1e1']
    : ['#a2281a', '#fbe3df', '#8a5a00', '#efd8a3', '#fbefcf', '#e1e1e1'];
  return makeChart({ title, subtitle, width, height: Math.max(40, rows.length * 63) }, () =>
    rows.map(({ label, counts }, index) => {
      let leftEdge = left;
      const top = index * 63 + 4;
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      const name = chartLines(label, 25).map((line, i) => svgText(left - 9, top + 15 + i * 15, line, 'text-anchor="end"')).join('');
      if (!total) return name + svgText(left, top + 18, 'Sem estudantes');
      return name + PATTERNS.map((pattern, i) => {
        const count = counts[pattern.id] ?? 0;
        if (!count) return '';
        const pct = 100 * count / total;
        const length = span * pct / 100;
        const x = leftEdge;
        leftEdge += length;
        const labelColor = (print ? i < 3 : i === 0 || i === 2) ? '#fff' : chartInk;
        const labels = chartLines(pattern.label, Math.max(7, Math.floor(length / 6)));
        const caption = pct < 8 ? '' : svgText(x + length / 2, top + 37, Math.round(pct) + '%', `text-anchor="middle" fill="${labelColor}"`) +
          labels.map((line, j) => svgText(x + length / 2, top + 14 + j * 11, line, `text-anchor="middle" font-size="10" fill="${labelColor}"`)).join('');
        return `<rect x="${x}" y="${top}" width="${length}" height="44" fill="${colors[i]}"><title>${pattern.label}: ${count}</title></rect>` + caption;
      }).join('');
    }).join(''));
}

function scatterChart({ title, subtitle, points, xLabel, yLabel, print = false }) {
  const width = 680;
  const height = 250;
  const left = 54;
  const right = width - 30;
  const bottom = height - 52;
  const xMax = Math.max(1, ...points.map(point => point.x));
  const x = value => left + value / xMax * (right - left);
  const y = value => bottom - value / 100 * (bottom - 27);
  return makeChart({ title, subtitle, width, height }, () =>
    `<path d="M${left} 27V${bottom}H${right}" stroke="${chartAxes}" fill="none"/>` +
    svgText(left, 15, yLabel, `fill="${chartMuted}"`) +
    svgText(left - 7, 32, '100%', `text-anchor="end" fill="${chartMuted}"`) +
    svgText(left - 7, bottom + 4, '0%', `text-anchor="end" fill="${chartMuted}"`) +
    svgText(left, bottom + 20, '0', 'text-anchor="middle"') +
    svgText(right, bottom + 20, xMax, 'text-anchor="middle"') +
    svgText((left + right) / 2, height - 7, xLabel, `text-anchor="middle" fill="${chartMuted}"`) +
    [...points].sort((a, b) => Number(Boolean(a.highlight)) - Number(Boolean(b.highlight))).map(point =>
      `<circle cx="${x(point.x)}" cy="${y(point.y)}" r="5" fill="${point.highlight ? chartFocus(print) : chartContext}" fill-opacity=".78"><title>${escapeMarkup(point.label)} · ${point.x} · ${point.y.toLocaleString('pt-BR')}%</title></circle>`).join(''));
}

const demoFirstNames = ['Ana', 'Beatriz', 'Caio', 'Daniela', 'Elisa', 'Fábio', 'Gabriela', 'Hugo', 'Isabel', 'João',
  'Lara', 'Mateus', 'Nina', 'Olívia', 'Paulo', 'Rita', 'Samuel', 'Tainá', 'Vítor', 'Yasmin'];
const demoLastNames = ['Ribeiro', 'Alves', 'Pereira', 'Andrade', 'Martins', 'Costa', 'Rocha', 'Fernandes', 'Lima', 'Barros'];
const demoActivities = ['Apresentação no fórum', 'Questionário de informática', 'Pesquisa na web\nAtividade prática',
  'Editor de texto', 'Planilhas', 'Projeto final'];

function mulberry32(seed) {
  return () => {
    let value = seed += 0x6D2B79F5;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  };
}

function demoCSV(rows) {
  return '\uFEFF' + rows.map(row => row.map(value => '"' + String(value).replaceAll('"', '""') + '"').join(',')).join('\r\n');
}

function generateDemo({ seed, turma, start, weeks, students }) {
  const random = mulberry32(seed);
  const dateAt = offset => new Date(Date.parse(start + 'T00:00:00Z') + offset * 86_400_000).toISOString().slice(0, 10);
  const end = weeks - 1;
  const half = Math.ceil(weeks / 2);
  const log = [['Hora', 'Nome completo', 'Usuário afetado', 'Contexto do Evento', 'Componente', 'Nome do evento', 'Descrição', 'Origem', 'endereço IP']];
  const course = 'Curso: Introdução à Informática · ' + turma + ' (dados fictícios)';
  const addEvent = (day, name, event = 'Curso visualizado', origin = 'web') => {
    const [year, month, date] = dateAt(day).split('-');
    const hour = Math.floor(8 + random() * 11);
    log.push([date + '/' + month + '/' + year.slice(2) + ', ' + String(hour).padStart(2, '0') + ':15:00',
      name, '', course, 'Sistema', event, '', origin, '0.0.0.0']);
  };
  const completion = [['', 'Endereço de email', ...demoActivities.flatMap(activity => [activity, ''])]];
  for (let i = 0; i < students; i++) {
    const first = demoFirstNames[i % demoFirstNames.length];
    const last = demoLastNames[Math.floor(i / demoFirstNames.length) % demoLastNames.length];
    const batch = Math.floor(i / (demoFirstNames.length * demoLastNames.length));
    const name = first + ' ' + last + (batch ? ' ' + (batch + 1) : '');
    const fraction = (i + 0.5) / students;
    const schedule = [];
    for (let week = 0; week < weeks; week++) {
      if (fraction < 0.55 && (week === 0 || week === end || week % 2 === 0 || random() < 0.82)) schedule.push(week);
      else if (fraction >= 0.55 && fraction < 0.67 && week < weeks - 3) schedule.push(week);
      else if (fraction >= 0.67 && fraction < 0.79 && (week < half || (end - week) % 3 === 0)) schedule.push(week);
      else if (fraction >= 0.79 && fraction < 0.87 && (week === 2 || week === end)) schedule.push(week);
      else if (fraction >= 0.87 && fraction < 0.95 && (end - week) % 2 === 0) schedule.push(week);
    }
    for (const week of schedule) {
      const day = week * 7 + 2;
      addEvent(day, name, 'Curso visualizado', random() < 0.2 ? 'ws' : 'web');
      if (random() < 0.48) addEvent(day, name, 'Módulo de curso visualizado');
      if (random() < 0.55) addEvent(day + 2, name);
    }
    if (i === 0) addEvent(weeks * 7 + 91, name);
    const chance = 0.08 + 0.85 * schedule.length / weeks;
    completion.push([name, 'estudante' + (i + 1) + '@example.invalid', ...demoActivities.flatMap(() =>
      random() < chance ? ['Concluído', dateAt(end * 7 + 6) + ' 16:00:00'] : ['Não concluído', ''])]);
  }
  addEvent(1, 'Helena Mendes', 'O envio foi avaliado.');
  addEvent(weeks * 7 - 1, 'Rafael Pinto', 'Relatório de log visto');
  addEvent(weeks * 7 - 1, 'Rafael Pinto', 'Rotina do sistema', 'cli');
  return { logText: demoCSV(log), completionText: demoCSV(completion) };
}

function matchingLogs(a, b) {
  return a && b && (a === b || (a.course === b.course && a.events.length === b.events.length &&
    a.events.every((event, i) => {
      const other = b.events[i];
      return +event.time === +other.time && event.user === other.user && event.origin === other.origin &&
        event.event === other.event && event.component === other.component;
    })));
}

function addClass(state, classData) {
  const same = c => normalizeName(c.name) === normalizeName(classData.name) || matchingLogs(c.log, classData.log);
  const firstMatch = state.classes.findIndex(same);
  const classes = state.classes.filter(c => !same(c));
  const activeIndex = firstMatch === -1 ? classes.length : firstMatch;
  classes.splice(activeIndex, 0, classData);
  return { state: { ...state, classes, activeIndex }, replaced: firstMatch !== -1 };
}

    <form id="review-form" class="stack"><div class="field"><label for="review-name">Nome da turma</label>
      <input id="review-name" value="${uiEscape(c.name)}" required></div>
      <div class="field-grid"><div class="field"><label for="review-start">Início</label><input type="date" id="review-start" value="${c.period.start}" required></div>
      <div class="field"><label for="review-end">Fim</label><input type="date" id="review-end" value="${c.period.end}" required></div></div>
      <details><summary>Revisar quem é equipe</summary><div class="people">${participants.map(({ label, staff }, i) =>
        `<label><input type="checkbox" data-person="${i}"${staff ? ' checked' : ''}>${uiEscape(label)}</label>`).join('')}</div></details>
      <p id="review-error" class="error" role="alert"></p>
      <div class="actions"><button type="submit" class="primary">Ver análise</button><button type="button" data-action="upload">Voltar ao carregamento</button></div>
    </form></section>`;
}

function helpView() {
  let video = '';
  if (/^https:\/\//i.test(VIDEO_AJUDA)) video = `<p><a href="${uiEscape(VIDEO_AJUDA)}" target="_blank" rel="noopener noreferrer">Assistir ao vídeo</a></p>`;
  else if (/^(?!\/)[\w/.\-]+\.mp4$/i.test(VIDEO_AJUDA)) video = `<video controls preload="none" src="${uiEscape(VIDEO_AJUDA)}">Vídeo de exportação dos relatórios do Moodle.</video>`;
  return `<section id="moodle-help" class="surface narrow stack help"><h1 data-view-heading tabindex="-1">Como baixar os relatórios do Moodle</h1>
    <div><h2>Log do curso</h2><ol><li>Abra o curso e vá a <strong>Relatórios → Logs</strong>.</li>
      <li>Deixe selecionados todos os participantes, dias, atividades e demais filtros.</li>
      <li>Selecione <strong>Obter estes logs</strong>.</li>
      <li>Escolha <strong>Valores separados por vírgula (.csv)</strong> e baixe o arquivo.</li></ol></div>
    <div><h2>Conclusão de atividades</h2><ol><li>No curso, acesse <strong>Relatórios → Conclusão de atividades</strong>.</li>
      <li>Baixe o relatório em <strong>CSV</strong> e carregue-o no campo opcional da mesma turma.</li></ol></div>
    ${video}
    <div class="stack"><h2>Perguntas frequentes</h2>
      <details><summary>Por que alguns estudantes não aparecem?</summary><p>O log só registra quem fez algo no curso. Use a conclusão de atividades para incluir toda a turma.</p></details>
      <details><summary>Como os padrões são definidos?</summary><p>Os padrões usam dias de ausência e distribuição das semanas com acesso. São sinais para orientar o acompanhamento.</p></details>
      <details><summary>Meus dados saem do computador?</summary><p>Os relatórios são processados no seu navegador. Você escolhe onde guardar os CSVs e PDFs que exportar.</p></details>
    </div><div class="actions"><button type="button" data-action="back">Voltar</button></div></section>`;
}

function analysisView(state, c) {
  if (state.tab === 'triage') return triageView(state, c);
  if (state.tab === 'diary') return diaryView(state, c);
  if (state.tab === 'compare') return compareView(state, c);
  return completionView(state, c);
}

function render(state) {
  currentState = state;
  const c = activeClass(state);
  document.querySelector('#top-class').textContent = c?.name ?? '';
  document.querySelector('#navigation').innerHTML = navigation(state);
  const main = document.querySelector('main');
  if (state.view === 'help') main.innerHTML = helpView();
  else if (state.view === 'review') main.innerHTML = reviewView(state.draft);
  else if (state.view === 'analysis' && c) {
    main.innerHTML = (c.demo ? '<p class="demo-band">Dados fictícios de demonstração</p>' : '') +
      `<section role="tabpanel" id="panel-${state.tab}" aria-labelledby="tab-${state.tab}">${analysisView(state, c)}</section>` +
      tabs.filter(([id]) => id !== state.tab).map(([id]) =>
        `<section role="tabpanel" id="panel-${id}" aria-labelledby="tab-${id}" hidden></section>`).join('');
  } else main.innerHTML = uploadView();
}

function update(next, focus) {
  render({ ...currentState, ...next });
  if (focus) document.querySelector(focus)?.focus();
}

function notice(message) {
  const el = document.querySelector('#notice');
  el.textContent = message;
  el.hidden = !message;
}

function changeView(view, extra = {}) {
  notice('');
  update({ view, ...extra }, '[data-view-heading]');
}

function fileError(input, message) {
  input.toggleAttribute('aria-invalid', Boolean(message));
  if (message) input.setAttribute('aria-invalid', 'true');
  document.getElementById(input.id + '-error').innerHTML = message ? uiEscape(message) + ' ' + helpButton('Ver ajuda') : '';
}

async function fromFile(input, parse) {
  const file = input.files[0];
  if (!file) {
    if (input.id === 'log-file') throw new Error('Escolha o CSV de logs do curso.');
    return null;
  }
  if (/\.(xlsx?|ods|zip)$/i.test(file.name)) throw new FormatError('not-csv');
  return parse(await file.text());
}

async function submitUpload(form) {
  const logInput = form.querySelector('#log-file');
  const completionInput = form.querySelector('#completion-file');
  const button = form.querySelector('button[type="submit"]');
  button.disabled = true;
  const results = await Promise.allSettled([fromFile(logInput, parseLog), fromFile(completionInput, parseCompletion)]);
  if (!form.isConnected) return;
  button.disabled = false;
  const errorMessages = ['Não foi possível ler o log do curso. Confira Relatórios → Logs.',
    'Não foi possível ler a conclusão. Baixe o CSV em Relatórios → Conclusão de atividades.'];
  const inputs = [logInput, completionInput];
  for (const [i, result] of results.entries()) {
    let message = result.status === 'rejected' ? result.reason instanceof FormatError || !inputs[i].files.length
      ? result.reason.message : errorMessages[i] : '';
    if (i === 1 && result.reason?.code === 'not-csv') message += ' Baixe o CSV em Relatórios → Conclusão de atividades.';
    fileError(inputs[i], message);
  }
  const firstError = results.findIndex(result => result.status === 'rejected');
  if (firstError !== -1) {
    inputs[firstError].focus();
    return;
  }
  const [log, completion] = results.map(result => result.value);
  if (completion) completion.students = completion.students.map(({ name, done }) => ({ name, done }));
  const name = form.querySelector('#class-name').value.trim() || log.course || 'Turma';
  const draft = completeOffer({ name, log, completion }, currentState.absenceLimit);
  changeView('review', { draft });
}

function submitReview(form) {
  const draft = currentState.draft;
  const name = form.querySelector('#review-name').value.trim();
  const start = form.querySelector('#review-start').value;
  const end = form.querySelector('#review-end').value;
  const error = form.querySelector('#review-error');
  if (!name || end < start) {
    error.textContent = name ? 'A data final precisa ser igual ou posterior à inicial.' : 'Informe o nome da turma.';
    form.querySelector(name ? '#review-end' : '#review-name').focus();
    return;
  }
  const names = [...draft.students.map(row => row.name), ...draft.staff];
  const overrides = { staff: [], students: [] };
  for (const input of form.querySelectorAll('[data-person]')) {
    overrides[input.checked ? 'staff' : 'students'].push(names[Number(input.dataset.person)]);
  }
  const c = completeOffer({ ...draft, name, period: { start, end }, overrides }, currentState.absenceLimit);
  const { state, replaced } = addClass(currentState, c);
  changeView('analysis', { ...state, view: 'analysis', tab: 'triage', draft: null, studentCode: null });
  if (replaced) notice('A turma que já estava aberta foi substituída.');
}

function showDemo() {
  let state = currentState;
  for (const [seed, start, students] of [[2025, '2025-03-03', 36], [2026, '2026-03-02', 40]]) {
    const name = 'MSI ' + seed + '/1 (dados fictícios)';
    const demo = generateDemo({ seed, turma: 'MSI ' + seed + '/1', start, weeks: 18, students });
    const c = completeOffer({ name, log: parseLog(demo.logText), completion: parseCompletion(demo.completionText), demo: true }, state.absenceLimit);
    state = addClass(state, c).state;
  }
  changeView('analysis', { ...state, view: 'analysis', tab: 'triage', draft: null, studentCode: null });
}

function openTab(tab) {
  notice('');
  update({ tab }, '#tab-' + tab);
}

function bindPage() {
  document.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.tab) openTab(button.dataset.tab);
    switch (button.dataset.action) {
      case 'help': if (currentState.view !== 'help') changeView('help', { returnView: currentState.view }); break;
      case 'back': changeView(currentState.returnView ?? 'upload'); break;
      case 'upload': changeView('upload', { draft: null }); break;
      case 'demo': showDemo(); break;
      case 'copy': void copyGroup(button.dataset.group); break;
      case 'diary-filter': update({ diaryFilter: button.dataset.filter, studentCode: null }, '#filter-' + button.dataset.filter); break;
      case 'student-detail': {
        const { scrollLeft, scrollTop } = document.querySelector('.matrix-scroll');
        update({ studentCode: button.dataset.code }, '#detail-title');
        Object.assign(document.querySelector('.matrix-scroll'), { scrollLeft, scrollTop });
        break;
      }
      case 'close-detail': update({ studentCode: null }, '#student-' + currentState.studentCode); break;
    }
  });
  document.addEventListener('keydown', event => {
    const i = tabs.findIndex(([id]) => event.target.dataset.tab === id);
    if (i === -1) return;
    const positions = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i + tabs.length - 1) % tabs.length, Home: 0, End: tabs.length - 1 };
    if (!Object.hasOwn(positions, event.key)) return;
    event.preventDefault();
    openTab(tabs[positions[event.key]][0]);
  });
  document.addEventListener('submit', event => {
    if (!['upload-form', 'review-form'].includes(event.target.id)) return;
    event.preventDefault();
    if (event.target.id === 'upload-form') void submitUpload(event.target);
    else submitReview(event.target);
  });
  document.addEventListener('change', event => {
    if (event.target.id === 'diary-sort') update({ diarySort: event.target.value }, '#diary-sort');
    if (event.target.id === 'absence-limit') {
      const absenceLimit = Number(event.target.value);
      const classes = currentState.classes.map(c => completeOffer(c, absenceLimit));
      notice('');
      update({ classes, absenceLimit }, '#absence-limit');
    }
    if (event.target.id === 'active-class') {
      notice('');
      update({ activeIndex: Number(event.target.value), studentCode: null }, '#active-class');
    }
    if (event.target.type === 'file') fileError(event.target, '');
  });
  for (const type of ['dragover', 'dragleave', 'drop']) {
    document.addEventListener(type, event => {
      const zone = event.target.closest('[data-drop]');
      if (!zone) {
        if (type === 'drop' && event.dataTransfer?.files.length) event.preventDefault();
        return;
      }
      event.preventDefault();
      zone.classList.toggle('dragging', type === 'dragover');
      if (type !== 'drop' || !event.dataTransfer.files.length) return;
      const input = document.getElementById(zone.dataset.drop);
      const transfer = new DataTransfer();
      transfer.items.add(event.dataTransfer.files[0]);
      input.files = transfer.files;
      fileError(input, '');
    });
  }
  render(currentState);
}

if (typeof document !== 'undefined') bindPage();

function triageGroups(c) {
  return PATTERNS.slice(1, -1).map(pattern => {
    const first = pattern.id === 'afastamento';
    const students = c.students.filter(row => row.pattern === pattern.id || (first && row.pattern === 'sem-acesso'));
    students.sort((a, b) => (b.daysSinceLast ?? Infinity) - (a.daysSinceLast ?? Infinity));
    return { ...pattern, label: first ? 'Sem acesso ou afastamento' : pattern.label, students };
  });
}

function studentReason(row, weeks) {
  switch (row.pattern) {
    case 'sem-acesso': return 'nenhum acesso no período';
    case 'afastamento': return `sem acesso há ${row.daysSinceLast} dias`;
    case 'queda': return `${row.firstHalfWeeks} semanas com acesso na 1ª metade, ${row.secondHalfWeeks} na 2ª`;
    case 'concentrado': return `acessos em ${row.daysActive} dias`;
    default: return `${row.weeksActive} de ${weeks} semanas com acesso`;
  }
}

const accessReminder = 'Acesso ao Moodle não é o mesmo que participação ou aprendizagem. Use estes sinais para conversar com o estudante.';
const numberPt = value => value.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const shownName = (row, state) => state.anonymize ? row.code : row.name;

function classNumbers(c) {
  const summary = summarizeClass(c);
  const metrics = [
    [summary.n, 'Estudantes'],
    [numberPt(summary.medianWeeksActive) + ' de ' + c.weeks, 'Semanas com acesso (mediana)'],
    [c.students.filter(row => row.longestAbsence >= c.absenceLimit).length, 'Estudantes com ausência de ' + c.absenceLimit + '+ dias'],
    [summary.patternCounts['sem-acesso'] + summary.patternCounts.afastamento, 'Sem acesso ou em afastamento'],
  ];
  return `<dl class="class-numbers">${metrics.map(([value, label]) =>
    `<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>`;
}

function patternRules() {
  const texts = [
    'Nenhum acesso no período. Aparece com o relatório de conclusão.',
    'Dias desde o último acesso iguais ou superiores ao limite.',
    'Pelo menos 3 semanas com acesso na primeira metade e, na segunda, no máximo metade desse número.',
    'Acesso em menos de 40% das semanas, com mais da metade dos dias de acesso concentrados em até duas semanas.',
    'Acesso em menos de 70% das semanas ou uma ausência igual ou superior ao limite.',
    'Demais casos.',
  ];
  return `<details class="pattern-rules"><summary>Como os padrões são definidos</summary>
    <ol>${PATTERNS.map(({ label }, index) => `<li><strong>${label}.</strong> ${texts[index]}</li>`).join('')}</ol>
    <p>A primeira regra atendida define o padrão. Em períodos com um número ímpar de semanas, a semana do meio entra na primeira metade.</p></details>`;
}

function groupCards(c, state, copying = true) {
  const card = row => `<li><strong>${uiEscape(shownName(row, state))}</strong><span>${studentReason(row, c.weeks)}</span></li>`;
  const regular = c.students.filter(row => row.pattern === 'regular');
  const groups = triageGroups(c);
  return `<div class="triage-grid">${groups.map(group => `<section class="pattern-group">
    <div class="group-head"><h2 class="tag ${group.tone}">${group.label}</h2><strong class="group-count">${group.students.length}</strong></div>
    <p class="mediation">Sugestão: ${group.strategy}</p>
    ${group.students.length ? `<ul class="student-cards">${group.students.map(card).join('')}</ul>` : '<p class="muted">Nenhum estudante neste grupo.</p>'}
    ${copying ? `<button type="button" data-action="copy" data-group="${group.id}" aria-label="Copiar lista de ${group.label.toLowerCase()}"${group.students.length ? '' : ' disabled'}>Copiar lista</button>` : ''}
    </section>`).join('')}</div>${copying ? `<details class="regular-list"><summary>Regular (${regular.length})</summary>
    <ul class="student-cards">${regular.map(card).join('')}</ul></details>` : `<section class="regular-list"><h2>Regular (${regular.length})</h2>
    <ul class="student-cards">${regular.map(card).join('')}</ul></section>`}`;
}

function triageView(state, c) {
  return `<div class="stack triage">
    <div class="section-head"><div><h1 data-view-heading tabindex="-1">Quem precisa de contato</h1><p class="muted">${periodLabel(c.period)}</p></div>
      <label class="field">Limite de ausência <select id="absence-limit">${[7, 14, 21].map(limit =>
        `<option value="${limit}"${c.absenceLimit === limit ? ' selected' : ''}>${limit} dias</option>`).join('')}</select></label></div>
    ${classNumbers(c)}
    <p class="reminder">${accessReminder}</p>
    ${c.warnings.map(warning => `<p class="muted">${warning}</p>`).join('')}
    ${groupCards(c, state)}
    ${patternRules()}
  </div>`;
}

async function copyGroup(id) {
  const c = activeClass(currentState);
  const group = triageGroups(c).find(group => group.id === id);
  const list = group.students.map(row => shownName(row, currentState)).join('\n');
  notice('');
  try {
    await navigator.clipboard.writeText(list);
    notice('Lista copiada');
  } catch {
    const noticeBox = document.querySelector('#notice');
    if (activeClass(currentState) !== c || currentState.view !== 'analysis' || currentState.tab !== 'triage') return;
    notice('Selecione e copie a lista abaixo.');
    const input = document.createElement('textarea');
    input.readOnly = true;
    input.rows = Math.min(group.students.length, 8);
    input.setAttribute('aria-label', 'Lista de estudantes para copiar');
    input.value = list;
    noticeBox.append(input);
    input.focus();
    input.select();
  }
}

function tintLevel(days) {
  if (days <= 2) return days;
  return days <= 4 ? 3 : 4;
}

function tagFor(pattern) {
  const { label, tone } = PATTERNS.find(({ id }) => id === pattern);
  return `<span class="tag ${tone}">${label}</span>`;
}

function reportTable(caption, headings, rows) {
  return `<div class="table-scroll" tabindex="0" role="region" aria-label="${uiEscape(caption)}">
    <table class="report-table"><caption>${uiEscape(caption)}</caption><thead><tr>${headings.map(heading =>
      `<th scope="col">${uiEscape(heading)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(([label, ...values]) => `<tr><th scope="row">${uiEscape(label)}</th>${values.map(value =>
        `<td>${uiEscape(value)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function chartFigure(svg, label, equivalent) {
  return `<figure class="chart"><div class="chart-scroll" tabindex="0" role="region" aria-label="${uiEscape(label)}">${svg}</div>
    <details class="chart-data"><summary>Ver tabela · ${uiEscape(label)}</summary>${equivalent}</details></figure>`;
}

function weeklyGraphic(c, print = false) {
  const series = weeklySeries(c);
  const week = sustainedDeclineWeek(series);
  const title = c.students.length ? titleWeekly(series) : 'A turma está sem estudantes identificados';
  const svg = lineChart({
    title, subtitle: 'Percentual de estudantes com acesso por semana · ' + periodLabel(c.period),
    series: [{ label: 'Turma', values: series.map(row => row.pct), highlight: true }],
    xLabels: series.map(row => 'S' + row.week), print,
    annotation: week === null || !c.students.length ? undefined : { index: week - 1, text: 'Menos de 50%' },
  });
  if (print) return svg;
  return chartFigure(svg, 'Acesso semanal', reportTable('Acesso semanal', ['Semana', 'Estudantes com acesso', 'Percentual'],
    series.map(({ week, n, pct }) => ['S' + week, n, numberPt(pct) + '%'])));
}

function detailView(row, c, state) {
  if (!row) return '';
  const pattern = PATTERNS.find(item => item.id === row.pattern);
  const active = new Set(row.activeDays);
  const days = Array.from({ length: daysBetween(c.period.start, c.period.end) + 1 }, (_, i) => {
    const key = shiftDay(c.period.start, i);
    const [status, css] = key > c.refDate ? ['fora da janela observada', 'unobserved']
      : active.has(key) ? ['com acesso', 'visited'] : ['sem acesso', ''];
    const label = key.split('-').reverse().join('/') + ' · ' + status;
    return `<li class="${css}" title="${label}" aria-label="${label}"></li>`;
  }).join('');
  const measures = [
    ['Acessos', row.accesses], ['Dias com acesso', row.daysActive], ['Semanas com acesso', row.weeksActive + ' de ' + c.weeks],
    ['Maior ausência (dias)', row.longestAbsence], ['Dias desde o último acesso', row.daysSinceLast ?? '—'],
    ['Ausências de 7+ dias', row.gaps7], ['Ausências de 14+ dias', row.gaps14], ['Ausências de 21+ dias', row.gaps21],
    ['Semanas com acesso na 1ª metade', row.firstHalfWeeks], ['Semanas com acesso na 2ª metade', row.secondHalfWeeks],
  ];
  const completed = c.activities.filter((_, index) => row.done?.[index]);
  return `<section class="surface stack" aria-labelledby="detail-title">
    <div class="section-head"><h2 id="detail-title" tabindex="-1">${uiEscape(shownName(row, state))}</h2>
    <button type="button" data-action="close-detail">Fechar detalhe</button></div>
    <p>${tagFor(row.pattern)} ${pattern.strategy}</p>
    <div class="stack"><h3>Linha do tempo diária</h3><ul class="daily-track" aria-label="Dias do período">${days}</ul>
      <p class="muted">Verde indica acesso. Creme indica dia sem acesso. Tracejado indica dia fora da janela observada.</p></div>
    ${reportTable('Indicadores individuais', ['Indicador', 'Valor'], measures)}
    ${c.hasCompletion ? `<div><h3>Atividades concluídas${row.done ? ' (' + row.completed + ' de ' + row.completionTotal + ')' : ''}</h3>
      ${completed.length ? `<ul>${completed.map(activity => `<li>${uiEscape(activity)}</li>`).join('')}</ul>`
        : `<p>${row.done ? 'Nenhuma atividade concluída.' : 'Sem registro no relatório de conclusão.'}</p>`}</div>` : ''}
  </section>`;
}

function diaryView(state, c) {
  const { diarySort = 'name', diaryFilter = 'all', studentCode } = state;
  const students = c.students.filter(row => diaryFilter === 'all' || row.pattern === diaryFilter);
  const order = PATTERNS.map(({ id }) => id);
  if (diarySort === 'pattern') students.sort((a, b) => order.indexOf(a.pattern) - order.indexOf(b.pattern));
  if (diarySort === 'weeks') students.sort((a, b) => b.weeksActive - a.weeksActive);
  const filters = [{ id: 'all', label: 'Todos' }, ...PATTERNS];
  const sorts = [['name', 'Nome'], ['pattern', 'Padrão'], ['weeks', 'Semanas com acesso']];
  const headings = Array.from({ length: c.weeks }, (_, i) => `<th scope="col">S${i + 1}</th>`).join('');
  const rows = students.map(row => `<tr><th scope="row"><button type="button" class="link" data-action="student-detail"
    id="student-${row.code}" data-code="${row.code}">${uiEscape(shownName(row, state))}</button></th>
    ${row.weeklyDays.map((days, i) => {
      const label = `S${i + 1}: ${days} ${days === 1 ? 'dia' : 'dias'} com acesso`;
      return `<td class="t${tintLevel(days)}" title="${label}" aria-label="${label}">${days}</td>`;
    }).join('')}<td>${tagFor(row.pattern)}</td></tr>`).join('');
  return `<div class="stack"><div><h1 data-view-heading tabindex="-1">Diário semanal</h1>
    <p class="muted">${periodLabel(c.period)}</p></div>
    ${weeklyGraphic(c)}
    <div class="section-head"><h2>Dias com acesso por estudante</h2><label class="field">Ordenar por
      <select id="diary-sort">${sorts.map(([value, label]) =>
        `<option value="${value}"${value === diarySort ? ' selected' : ''}>${label}</option>`).join('')}</select></label></div>
    <div class="filters" role="group" aria-label="Filtrar por padrão">
      ${filters.map(({ id, label }) => `<button type="button" id="filter-${id}" data-action="diary-filter" data-filter="${id}" aria-pressed="${diaryFilter === id}">${label}</button>`).join('')}</div>
    <div class="matrix-key"><strong>Dias com acesso na semana</strong>
      ${['0', '1', '2', '3–4', '5–7'].map((label, i) => `<span class="key-chip t${i}">${label}</span>`).join('')}</div>
    ${students.length ? `<div class="table-scroll matrix-scroll" tabindex="0" role="region" aria-label="Matriz de acesso semanal">
      <table class="matrix" aria-label="Dias com acesso em cada semana"><thead><tr><th scope="col">Estudante</th>${headings}<th scope="col">Padrão</th></tr></thead>
      <tbody>${rows}</tbody></table></div>` : '<p class="surface">Nenhum estudante neste filtro.</p>'}
    ${detailView(students.find(row => row.code === studentCode), c, state)}
  </div>`;
}

function compareRows(summaries) {
  const rows = [
    ['Estudantes', s => numberPt(s.n)],
    ['Período', s => periodLabel({ start: s.start, end: s.end })],
    ['Semanas', s => numberPt(s.weeks)],
    ['Mediana de semanas com acesso', s => numberPt(s.medianWeeksActive)],
    ['Mediana da maior ausência (dias)', s => numberPt(s.medianLongestAbsence)],
    ['Estudantes com ausência de 14+ dias', s => numberPt(s.studentsWithGap14)],
    ...PATTERNS.map(({ id, label }) => [label, s => s.patternCounts[id] + ' (' + numberPt(s.patternPct[id]) + '%)']),
    ['Mediana de atividades concluídas', s => s.medianCompletionPct === null ? '—' : numberPt(s.medianCompletionPct) + '%'],
  ];
  return rows.map(([label, format]) => ({ label, values: summaries.map(format) }));
}

function compareView(state, c) {
  const heading = '<h1 data-view-heading tabindex="-1">Comparar turmas</h1>';
  if (state.classes.length < 2) return `<section class="surface stack">${heading}
    <p>Carregue outra oferta para comparar.</p><div><button type="button" data-action="upload">Carregar arquivos</button></div></section>`;
  const entries = state.classes.map(offer => ({ name: offer.name, series: weeklySeries(offer), highlight: offer === c }));
  const summaries = state.classes.map(summarizeClass);
  const names = entries.map(entry => entry.name);
  const weeks = Array.from({ length: Math.max(...state.classes.map(offer => offer.weeks)) }, (_, i) => 'S' + (i + 1));
  const weekly = lineChart({ title: titleCompare(entries), subtitle: 'Percentual de estudantes com acesso por semana · ofertas alinhadas por semana',
    series: entries.map(e => ({ label: e.name, values: e.series.map(row => row.pct), highlight: e.highlight })), xLabels: weeks });
  const patterns = patternBars({ title: titlePatterns(summaries[state.activeIndex]),
    subtitle: 'Distribuição percentual dos padrões de acesso por oferta', rows: summaries.map(s => ({ label: s.name, counts: s.patternCounts })) });
  return `<div class="stack">${heading}
    ${chartFigure(weekly, 'Acesso semanal por turma', reportTable('Percentual por semana', ['Semana', ...names], weeks.map((week, i) =>
      [week, ...entries.map(entry => entry.series[i] ? numberPt(entry.series[i].pct) + '%' : '—')])))}
    ${chartFigure(patterns, 'Padrões por turma', reportTable('Padrões por turma', ['Padrão', ...names],
      PATTERNS.map(({ id, label }) => [label, ...summaries.map(s => s.patternCounts[id] + ' (' + numberPt(s.patternPct[id]) + '%)')])))}
    ${reportTable('Indicadores por turma', ['Indicador', ...names], compareRows(summaries).map(({ label, values }) => [label, ...values]))}
  </div>`;
}

function rankValues(values) {
  const order = values.map((value, i) => ({ value, i })).sort((a, b) => a.value - b.value);
  const result = Array(values.length);
  for (let start = 0; start < order.length;) {
    let end = start + 1;
    while (end < order.length && order[end].value === order[start].value) end++;
    const rank = (start + end + 1) / 2;
    for (let i = start; i < end; i++) result[order[i].i] = rank;
    start = end;
  }
  return result;
}

function spearman(points) {
  const xs = rankValues(points.map(p => p.x));
  const ys = rankValues(points.map(p => p.y));
  const center = (points.length + 1) / 2;
  let cov = 0;
  let sumX = 0;
  let sumY = 0;
  for (let i = 0; i < points.length; i++) {
    const x = xs[i] - center;
    const y = ys[i] - center;
    cov += x * y;
    sumX += x * x;
    sumY += y * y;
  }
  return sumX && sumY ? cov / Math.sqrt(sumX * sumY) : 0;
}

function completionView(state, c) {
  const heading = '<h1 data-view-heading tabindex="-1">Conclusão de atividades</h1>';
  if (!c.hasCompletion) return `<section class="surface stack">${heading}
    <p>No Moodle, abra <strong>Relatórios → Conclusão de atividades</strong> e baixe o CSV. Carregue-o junto com o log da turma.</p>
    <div class="actions">${helpButton()}<button type="button" data-action="upload">Carregar arquivos</button></div></section>`;
  const eligible = c.students.filter(row => row.completionTotal);
  if (!eligible.length) return `<section class="surface stack">${heading}<p>O relatório está sem registros de conclusão para os estudantes desta turma.</p></section>`;
  const points = eligible.map(row => ({
    x: row.weeksActive, y: 100 * row.completed / row.completionTotal,
    label: shownName(row, state), highlight: row.pattern !== 'regular',
  }));
  const title = spearman(points) >= 0.3 ? 'Quem acessou mais semanas concluiu mais atividades'
    : 'Semanas com acesso e atividades concluídas variaram de forma independente';
  const scatter = scatterChart({ title, subtitle: 'Verde indica padrões de atenção · ' + periodLabel(c.period), points,
    xLabel: 'Semanas com acesso', yLabel: 'Atividades concluídas' });
  const ordered = c.activities.map((label, i) => ({ label,
    value: Math.round(1000 * eligible.filter(row => row.done[i]).length / eligible.length) / 10,
  })).sort((a, b) => a.value - b.value);
  const bars = ordered.map((bar, i) => ({ ...bar, highlight: i < 3 }));
  const lowest = bars[0];
  const byActivity = barChartH({ title: lowest.label + ' teve a menor conclusão (' + numberPt(lowest.value) + '%)',
    subtitle: 'Percentual dos ' + eligible.length + ' estudantes presentes na análise e no relatório de conclusão', bars, unit: '%' });
  return `<div class="stack">${heading}
    ${chartFigure(scatter, 'Acesso e conclusão por estudante', reportTable('Acesso e conclusão por estudante',
      ['Estudante', 'Semanas com acesso', 'Atividades concluídas'], points.map(p => [p.label, p.x, numberPt(p.y) + '%'])))}
    ${chartFigure(byActivity, 'Conclusão por atividade', reportTable('Conclusão por atividade',
      ['Atividade', 'Percentual de estudantes'], bars.map(bar => [bar.label, numberPt(bar.value) + '%'])))}
  </div>`;
}
